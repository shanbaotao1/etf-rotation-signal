name: ETF 轮动信号（云端备份）

on:
  schedule:
    # 北京时间 13:30 = UTC 05:30；周一至周五
    - cron: '30 5 * * 1-5'
  # 允许在 GitHub 网页上手动触发（Actions 标签 → Run workflow）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 运行策略（云端模式）
        # CLOUD_MODE=1 时脚本跳过本地 PanWatch，改用新浪/东财公开行情，
        # 计算信号并写出 SIGNAL.md / index.html / positions_v1.json
        run: CLOUD_MODE=1 python etf_rotation_1.py

      - name: 提交信号结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SIGNAL.md index.html positions_v1.json kline_cache.json dyn_window_state.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新信号 $(date -u +%F)"
            git push
          fi
