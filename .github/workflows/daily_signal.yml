name: ETF 双策略信号（云端）

on:
  schedule:
    # 北京时间 13:30 = UTC 05:30；周一至周五
    - cron: '30 5 * * 1-5'
  # 允许在 GitHub 网页上手动触发（Actions 标签 → Run workflow）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 运行策略一：轮动V1（单持仓）
        # CLOUD_MODE=1 时脚本跳过本地 PanWatch，改用新浪/东财公开行情
        continue-on-error: true
        run: CLOUD_MODE=1 python etf_rotation_1.py

      - name: 运行策略二：五福v1.1（多持仓）
        continue-on-error: true
        run: python wufu_cloud.py

      - name: 生成双策略对比页
        run: python build_compare_page.py

      - name: 提交信号结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in SIGNAL.md index.html kline_cache.json dyn_window_state.json \
                   positions_v1.json history.json stats.json \
                   positions_wufu.json history_wufu.json stats_wufu.json; do
            [ -f "$f" ] && git add "$f"
          done
          true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新双策略信号 $(date -u +%F)"
            git push
          fi
