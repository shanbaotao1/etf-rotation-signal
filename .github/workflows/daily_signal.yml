name: ETF 三策略信号（云端）

on:
  schedule:
    # 北京时间 10:00 = UTC 02:00（三策略统一交易）
    # 说明：GitHub Actions 免费定时任务不保证准时（实测常延迟 2~3 小时），
    # 故把交易时间提前到 10:00，延迟后实际约 13:00 附近执行，正好回到盘中时段。
    - cron: '0 2 * * 1-5'
    # 北京时间 15:10 = UTC 07:10（收盘结算：用当日收盘价重算净值，不交易）
    # 结算用官方收盘价，与触发时刻无关，延迟不影响数据正确性。
    - cron: '10 7 * * 1-5'
  # 允许在 GitHub 网页上手动触发（Actions 标签 → Run workflow）
  # 手动触发时可勾选「收盘结算」直接跑结算模式
  workflow_dispatch:
    inputs:
      settle:
        description: '收盘结算模式（用收盘价重算当日净值，不交易）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUD_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 运行策略一：2_轮动V1（10:00交易）
        # 仅 10:00 定时 或 手动「非结算」时跑交易
        if: ${{ github.event.schedule == '0 2 * * 1-5' || github.event.inputs.settle == 'false' }}
        continue-on-error: true
        run: CLOUD_MODE=1 SETTLE=0 python etf_rotation_1.py

      - name: 运行策略二：3_五福v1.1（10:00交易）
        if: ${{ github.event.schedule == '0 2 * * 1-5' || github.event.inputs.settle == 'false' }}
        continue-on-error: true
        run: SETTLE=0 python wufu_cloud.py

      - name: 运行策略三：1_357ETF（10:00交易）
        if: ${{ github.event.schedule == '0 2 * * 1-5' || github.event.inputs.settle == 'false' }}
        continue-on-error: true
        run: CLOUD_MODE=1 SETTLE=0 python etf357_cloud.py

      - name: 收盘结算（15:10，三策略）
        # 仅 15:10 定时 或 手动勾选「收盘结算」时跑结算（不交易）
        if: ${{ github.event.schedule == '10 7 * * 1-5' || github.event.inputs.settle == 'true' }}
        continue-on-error: true
        run: |
          CLOUD_MODE=1 SETTLE=1 python etf_rotation_1.py
          SETTLE=1 python wufu_cloud.py
          CLOUD_MODE=1 SETTLE=1 python etf357_cloud.py

      - name: 生成三策略对比页
        run: python build_compare_page.py

      - name: 提交信号结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in SIGNAL.md index.html kline_cache.json dyn_window_state.json \
                   positions_v1.json history.json stats.json \
                   positions_wufu.json history_wufu.json stats_wufu.json \
                   SIGNAL_357.md kline_cache_357.json dyn_window_state_357.json \
                   positions_357.json history_357.json stats_357.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新三策略信号 $(date -u +%F)"
            git push
          fi

      - name: 镜像到 Gitee Pages（国内可访问）
        # 未配置 GITEE_TOKEN/GITEE_REPO 时自动跳过；配置后在 Gitee 开启 Pages 即可国内访问
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "未配置 GITEE_TOKEN/GITEE_REPO，跳过 Gitee 镜像"
            exit 0
          fi
          rm -rf gitee_mirror && mkdir gitee_mirror && cd gitee_mirror
          git init -q
          git checkout -b master
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote add origin "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          cp ../index.html ../SIGNAL.md \
             ../stats.json ../history.json ../positions_v1.json ../kline_cache.json ../dyn_window_state.json \
             ../stats_wufu.json ../history_wufu.json ../positions_wufu.json \
             ../SIGNAL_357.md ../stats_357.json ../history_357.json ../positions_357.json ../kline_cache_357.json ../dyn_window_state_357.json . 2>/dev/null
          git add -A
          if git commit -q -m "mirror: $(date -u +%F)"; then
            git push -q -f origin master && echo "Gitee 镜像成功" || echo "Gitee 推送失败(忽略)"
          else
            echo "无文件变化，跳过"
          fi
