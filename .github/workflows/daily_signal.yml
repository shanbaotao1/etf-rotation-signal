name: ETF 三策略信号（云端）

on:
  schedule:
    # 北京时间 13:10 = UTC 05:10（2_轮动V1 + 3_五福 交易）
    - cron: '10 5 * * 1-5'
    # 北京时间 13:30 = UTC 05:30（1_357ETF 交易）
    - cron: '30 5 * * 1-5'
    # 北京时间 15:10 = UTC 07:10（收盘结算：用收盘价重算当日净值，不交易）
    - cron: '10 7 * * 1-5'
  # 允许在 GitHub 网页上手动触发（Actions 标签 → Run workflow）
  # 手动触发时可勾选「收盘结算」直接跑结算模式
  workflow_dispatch:
    inputs:
      settle:
        description: '收盘结算模式（用收盘价重算当日净值，不交易）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUD_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 运行策略一：2_轮动V1（13:10交易）
        # 仅 13:10 定时 或 手动「非结算」时跑交易
        if: ${{ github.event.schedule == '10 5 * * 1-5' || github.event.inputs.settle == 'false' }}
        continue-on-error: true
        run: CLOUD_MODE=1 SETTLE=0 python etf_rotation_1.py

      - name: 运行策略二：3_五福v1.1（13:10交易）
        if: ${{ github.event.schedule == '10 5 * * 1-5' || github.event.inputs.settle == 'false' }}
        continue-on-error: true
        run: SETTLE=0 python wufu_cloud.py

      - name: 运行策略三：1_357ETF（13:30交易）
        # 仅 13:30 定时 或 手动「非结算」时跑交易
        if: ${{ github.event.schedule == '30 5 * * 1-5' || github.event.inputs.settle == 'false' }}
        continue-on-error: true
        run: CLOUD_MODE=1 SETTLE=0 python etf357_cloud.py

      - name: 收盘结算（15:10，三策略）
        # 仅 15:10 定时 或 手动勾选「收盘结算」时跑结算（不交易）
        if: ${{ github.event.schedule == '10 7 * * 1-5' || github.event.inputs.settle == 'true' }}
        continue-on-error: true
        run: |
          CLOUD_MODE=1 SETTLE=1 python etf_rotation_1.py
          SETTLE=1 python wufu_cloud.py
          CLOUD_MODE=1 SETTLE=1 python etf357_cloud.py

      - name: 生成三策略对比页
        run: python build_compare_page.py

      - name: 提交信号结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in SIGNAL.md index.html kline_cache.json dyn_window_state.json \
                   positions_v1.json history.json stats.json \
                   positions_wufu.json history_wufu.json stats_wufu.json \
                   SIGNAL_357.md kline_cache_357.json dyn_window_state_357.json \
                   positions_357.json history_357.json stats_357.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新三策略信号 $(date -u +%F)"
            git push
          fi
